<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mockerhost</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: 0.25rem; }
  p.tagline { color: #666; margin-top: 0; }
  label { display: block; margin-top: 1.25rem; font-weight: bold; }
  input { width: 100%; padding: 0.5rem; box-sizing: border-box; font-size: 1rem; }
  small { color: #666; }
  button { margin-top: 1.75rem; padding: 0.6rem 1.4rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<h1>mockerhost</h1>
<p class="tagline">Deploy a GitHub repo into a mocker container, on this network.</p>

<form method="POST" action="/deploy">
  <label for="github_url">GitHub repo URL</label>
  <input type="text" id="github_url" name="github_url" placeholder="https://github.com/user/repo" required>

  <label for="build_cmd">Build command</label>
  <input type="text" id="build_cmd" name="build_cmd" placeholder="npm install" required>

  <label for="run_cmd">Run command</label>
  <input type="text" id="run_cmd" name="run_cmd" placeholder="npm start" required>

  <label for="container_port">Port your app listens on inside the container</label>
  <input type="text" id="container_port" name="container_port" placeholder="3000" required>
  <small>The app must bind this port on 0.0.0.0, not just localhost, to be reachable through the proxy.</small>

  <button type="submit">Deploy</button>
</form>
</body>
</html>
