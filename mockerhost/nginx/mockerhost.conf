# mockerhost's nginx site: install once (mockerhost/README.md). Each app's location block is a
# separate file under /var/lib/mockerhost/nginx/apps/, written by clone_and_build.sh and picked
# up by the include below on `nginx -s reload`.
server {
    listen 80 default_server;
    server_name _;

    include /var/lib/mockerhost/nginx/apps/*.conf;

    location / {
        return 200 "mockerhost\n";
        add_header Content-Type text/plain;
    }
}
