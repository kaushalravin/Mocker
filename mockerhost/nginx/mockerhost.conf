# mockerhost's own nginx site - install this ONCE (see mockerhost/README.md),
# not regenerated per-deploy. Each deployed app's own location block lives in
# a separate file under /var/lib/mockerhost/nginx/apps/, dropped there by
# clone_and_build.sh and picked up by the include below on `nginx -s reload` -
# this file itself never needs to be touched again after the first install.
server {
    listen 80;
    server_name _;

    include /var/lib/mockerhost/nginx/apps/*.conf;

    location / {
        return 200 "mockerhost\n";
        add_header Content-Type text/plain;
    }
}
